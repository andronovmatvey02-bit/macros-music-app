
name: Build MACROS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create . --platforms=android --org com.macromus --project-name app

      - name: Get dependencies
        run: flutter pub get

      - name: Show Android signing fingerprints
        run: |
          cd android
          ./gradlew :app:signingReport | tee ../signing-report.txt
          cd ..

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macros-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
