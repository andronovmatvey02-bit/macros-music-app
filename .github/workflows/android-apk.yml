
name: Build MACROS Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create . --platforms=android --org com.macromus --project-name app

      - name: Get dependencies
        run: flutter pub get

      - name: Decode permanent Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/macros-upload.jks

      - name: Prepare signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=macros-upload.jks
          EOF

      
      - name: Configure release signing
        run: |
          sed -i '1i import java.util.Properties' android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts <<'EOF'

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(keystorePropertiesFile.inputStream())

          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = file(keystoreProperties.getProperty("storeFile"))
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF


      - name: Build release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease

      - name: Find and prepare APK
        shell: bash
        run: |
          echo "Searching for APK..."
          APK_PATH="$(find . -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK file was not found."
            exit 1
          fi

          echo "APK found: $APK_PATH"
          mkdir -p output
          cp "$APK_PATH" output/MACROS.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MACROS-Android-APK
          path: output/MACROS.apk
          if-no-files-found: error
